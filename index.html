<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive pricing component with traffic-based tiers, interactive slider, and yearly discount toggle.">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Google Fonts: Manrope 600, 800 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Interactive pricing component</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="bg-top-pattern" aria-hidden="true"></div>

  <header class="header">
    <div class="header__content">
      <h1 class="header__title">Simple, traffic-based pricing</h1>
      <p class="header__subtitle">
        <span>Sign-up for our 30-day trial.</span>
        <span>No credit card required.</span>
      </p>
    </div>
  </header>

  <main class="main-content">
    <article class="pricing-card">
      <div class="pricing-card__top">
        <!-- Pageviews count -->
        <p class="pricing-card__pageviews" id="pageviews-label">
          <span id="pageviews-count">100K</span> PAGEVIEWS
        </p>

        <!-- Slider -->
        <div class="slider-wrapper">
          <label for="price-slider" class="sr-only">Select number of pageviews</label>
          <input 
            type="range" 
            id="price-slider" 
            class="pricing-card__slider"
            name="price-slider"
            min="0" 
            max="4" 
            step="1" 
            value="2" 
            aria-valuemin="0" 
            aria-valuemax="4" 
            aria-valuenow="2"
          >
        </div>

        <!-- Price display -->
        <div class="pricing-card__price-wrapper">
          <span class="pricing-card__amount" id="price-amount">$16.00</span>
          <span class="pricing-card__billing-cycle">/ month</span>
        </div>

        <!-- Billing Toggle -->
        <div class="pricing-card__billing-toggle">
          <span class="billing-option" id="monthly-label">Monthly Billing</span>
          
          <label class="toggle-switch">
            <input 
              type="checkbox" 
              id="billing-toggle" 
              class="toggle-switch__input"
              name="billing-toggle"
              aria-labelledby="monthly-label yearly-label"
            >
            <span class="toggle-slider"></span>
          </label>

          <span class="billing-option" id="yearly-label">Yearly Billing</span>

          <span class="discount-badge">
            <span class="discount-badge__text discount-badge__text--desktop">25% discount</span>
            <span class="discount-badge__text discount-badge__text--mobile">-25%</span>
          </span>
        </div>
      </div>

      <hr class="pricing-card__divider">

      <div class="pricing-card__bottom">
        <ul class="features-list">
          <li class="features-list__item">
            <img class="features-list__icon" src="./images/icon-check.svg" alt="" aria-hidden="true">
            <span>Unlimited websites</span>
          </li>
          <li class="features-list__item">
            <img class="features-list__icon" src="./images/icon-check.svg" alt="" aria-hidden="true">
            <span>100% data ownership</span>
          </li>
          <li class="features-list__item">
            <img class="features-list__icon" src="./images/icon-check.svg" alt="" aria-hidden="true">
            <span>Email reports</span>
          </li>
        </ul>

        <button type="button" class="btn-cta" id="cta-button">
          Start my trial
        </button>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Caiokl3i" target="_blank" rel="noopener noreferrer">Caiokl3i</a>.
  </footer>

  <script src="./js/script.js"></script>
</body>
</html>
